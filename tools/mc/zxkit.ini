# ZxKit associations for Midnight Commander's mc.ext.ini, file format 4.0
# (MC 4.8.29 and later; older mc.ext files are not read at all).
#
# MC reads a single extension file and ~/.config/mc/mc.ext.ini replaces the
# system one, so append these sections to a complete copy of the system file
# rather than using this file on its own (docs/media-tools.md has the steps).
# Appending after [Default] works: MC merges repeated sections and applies
# [Default] only when no other section matched.
#
# In the 4.0 format a backslash in a value must be doubled (glib rejects
# invalid escape sequences), hence \\. below.

[mc.ext.ini]
Version=4.0

[ZxKit media]
Regex=\\.(tap|tzx|pzx|csw|trd|scl|mgt|opd|d40|d80|dsk|edsk|td0|cqm|mdr|nex|p3d)$
RegexIgnoreCase=true
Open=%cd %p/zxkit://
View=%view{ascii} zxmedia list %f

# IMG is intentionally a separate association: many unrelated formats use it.
[ZxKit disk images]
Regex=\\.img$
RegexIgnoreCase=true
Open=%cd %p/zxkit://
View=%view{ascii} zxmedia list %f
